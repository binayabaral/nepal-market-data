name: Deploy Site

on:
  # Code changes pushed by a human.
  push:
    branches: [main]

  # Data changes committed by the scrapers. This has to be workflow_run, not push: the scrapers push
  # with the default GITHUB_TOKEN, and GitHub deliberately does not fire triggers for pushes made
  # with it, to stop workflows recursing. So `push` above never sees a data commit. workflow_run is
  # the documented exception for chaining, and fires whoever started the upstream run.
  #
  # This matters more than it looks: the site is NOT self-refreshing. sync-data.ts copies data/ into
  # the deploy artifact, so the CSVs the charts fetch are the build-time snapshot, not the live repo.
  # Without this trigger the whole site freezes at the last human push, which is exactly what
  # happened: it served 2026-08-26 rows a day after 2026-08-27 was committed.
  workflow_run:
    workflows:
      - Scrape NEPSE
      - Scrape Precious Metals
      - Scrape SIP Mutual Fund NAVs
      - Reconcile history
    types: [completed]

  workflow_dispatch:

concurrency:
  # Deliberately NOT the shared `commit-data` group. That group exists to serialise the workflows
  # that push commits to this branch; this one only reads. Joining it would make every deploy queue
  # behind the scrapers for no reason. cancel-in-progress is correct here because deploys are
  # idempotent and only the newest matters, the opposite of the scrapers' cancel-in-progress: false.
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # On a workflow_run, only deploy if the upstream scrape actually succeeded. A failed scrape has
    # nothing new to publish, and deploying its half-state would be worse than waiting.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # site/ is a pnpm workspace member (see pnpm-workspace.yaml), sharing the one root lockfile,
      # so a single install covers both the root scripts and the site package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the site
        run: pnpm site:build

      # Runs before the artifact upload, so a broken build fails this step instead of deploying.
      - name: Smoke test the build
        run: pnpm site:smoke

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
